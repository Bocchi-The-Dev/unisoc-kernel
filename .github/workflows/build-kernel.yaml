name: Kernel Build

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install dependencies
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            libssl-dev \
            bison \
            flex \
            bc \
            cpio \
            libelf-dev \
            wget

      # Setup toolchain
      - name: Setup toolchain
        run: |
          cd toolchain
          # Do NOT prepend toolchain/bin to PATH (prepending causes host linker mix-up)
          echo "TOOLCHAIN_PATH=$(pwd)/bin" >> $GITHUB_ENV
          cd ..

      # Compile kernel
      - name: Compile kernel
        run: |
          export ARCH=arm64
          # Use the toolchain binaries via CROSS_COMPILE; do not put toolchain/bin before /usr/bin
          export CROSS_COMPILE=${{ env.TOOLCHAIN_PATH }}/aarch64-linux-gnu-
          
          # Configure kernel
          make defconfig
          
          # Build kernel
          make -j$(nproc)

      # Upload artifacts
      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/Image.gz
            arch/arm64/boot/dts/
            vmlinux
            System.map
          retention-days: 30
          if-no-files-found: warn
